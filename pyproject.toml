[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-drift-vector-watchdog"
version = "1.0.0"
description = "Embedding watchdog that tracks a Welford centroid and raises drift with a CUSUM on cosine distance."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TechieGoku2623"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "flake8==7.1.1",
]

[project.scripts]
semantic-drift-vector-watchdog = "semantic_drift_vector_watchdog.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
